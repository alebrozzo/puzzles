    </pattern>
    <g id="basket-diagonals">
      <path d="M12 -130 C40 -55 145 -8 188 50 M12 -102 C40 -27 145 20 188 78 M12 -74 C40 1 145 48 188 106 M12 -46 C40 29 145 76 188 134 M12 -18 C40 57 145 104 188 162 M12 10 C40 85 145 132 188 190 M12 38 C40 113 145 160 188 218 M12 66 C40 141 145 188 188 246 M12 94 C40 169 145 216 188 274 M12 122 C40 197 145 244 188 302 M12 150 C40 225 145 272 188 330 M12 178 C40 253 145 300 188 358 M12 206 C40 281 145 328 188 386"/>
    </g>
  </defs>
  <g fill="#fff" stroke="#262626" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 39 L36 227 C39 250 161 250 164 227 L183 39 Z"/>
    <ellipse cx="100" cy="38" rx="83" ry="25"/>
    <ellipse cx="100" cy="36" rx="75" ry="16.5" stroke-width="1.8"/>
  </g>
