  <path d="M17 39 C20 55 58 65 100 65 C142 65 180 55 183 39 L182 49 C177 64 141 74 100 74 C59 74 23 64 18 49 Z" fill="#fff" stroke="#262626" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M36 221 C44 241 156 241 164 221 L163 231 C153 251 47 251 37 231 Z" fill="#fff" stroke="#262626" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M24 69 L40 219 M176 69 L160 219" stroke="#555" stroke-width="1.3" stroke-linecap="round"/>
