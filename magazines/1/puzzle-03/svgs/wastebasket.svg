<svg xmlns="http://www.w3.org/2000/svg" width="400" height="520" viewBox="0 0 200 260" fill="none">
  <title>Wire-mesh wastebasket</title>
  <desc>A black-and-white line drawing of an empty, tapered wire wastebasket with an oval rim and curved diamond mesh. The background is transparent.</desc>
