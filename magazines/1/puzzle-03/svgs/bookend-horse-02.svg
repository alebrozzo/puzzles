<svg xmlns="http://www.w3.org/2000/svg" width="250" height="260" viewBox="0 0 250 260" fill="none">
  <title>White horse-head bookend</title>
  <desc>A single left-facing horse-head bookend with a pointed ear, arched neck, a flowing mane with outlined locks, and an outlined bridle. A tall vertical book-support plate stands behind the horse and joins a flat rectangular base. All enclosed shapes are white, without shading, hatching, or dark fills. Charcoal outlines sit against a transparent background, with no books or surrounding objects.</desc>
